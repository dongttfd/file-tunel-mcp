name: Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version. Must match source metadata.
        required: true
        default: "0.4.0"
        type: string

permissions:
  contents: read

concurrency:
  group: filemcp-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Validate production release credential presence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release version must be semantic numeric X.Y.Z." >&2; exit 1; }
          missing=()
          for name in \
            WINDOWS_CODESIGN_PFX_BASE64 \
            WINDOWS_CODESIGN_PFX_PASSWORD \
            MACOS_DEVELOPER_ID_P12_BASE64 \
            MACOS_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production-release Environment secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "production-release-preflight: ready"
  release-windows-x64:
    name: release-windows-x64
    needs: release-preflight
    runs-on: windows-2025
    timeout-minutes: 25
    environment: production-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      FILEMCP_WINDOWS_STAGING_NAME: FileMCP-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Validate release version and prepare signing material
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Release version must be semantic numeric X.Y.Z." }
          [xml]$project = Get-Content windows/src/FileMCP.App/FileMCP.App.csproj -Raw
          $sourceVersion = $project.SelectSingleNode("//Version").InnerText
          if ($sourceVersion -ne $env:RELEASE_VERSION) { throw "Release version does not match FileMCP.App.csproj." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw "WINDOWS_CODESIGN_PFX_BASE64 is not configured." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "filemcp-release.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          } catch {
            throw "WINDOWS_CODESIGN_PFX_BASE64 is not valid base64."
          }
          "FILEMCP_WINDOWS_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned Windows x64 release
        shell: pwsh
        run: ./build_windows_app.ps1 -Architecture x64 -StagingName $env:FILEMCP_WINDOWS_STAGING_NAME

      - name: Authenticode sign and verify Windows x64 release
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: ./release/sign_windows_release.ps1 -Architecture x64 -PfxPath $env:FILEMCP_WINDOWS_PFX_PATH -StagingName $env:FILEMCP_WINDOWS_STAGING_NAME -Version $env:RELEASE_VERSION

      - name: Post-sign Windows x64 packaged smoke
        shell: pwsh
        run: ./tests/test_windows_app.ps1 -Architecture x64

      - name: Upload signed Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-windows-x64-signed
          path: dist/FileMCP-v${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:FILEMCP_WINDOWS_PFX_PATH)) {
            Remove-Item -LiteralPath $env:FILEMCP_WINDOWS_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

  release-windows-arm64:
    name: release-windows-arm64
    needs: release-preflight
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 25
    environment: production-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      FILEMCP_WINDOWS_STAGING_NAME: FileMCP-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne "Arm64") { throw "Expected native Windows ARM64 runner." }

      - name: Validate release version and prepare signing material
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Release version must be semantic numeric X.Y.Z." }
          [xml]$project = Get-Content windows/src/FileMCP.App/FileMCP.App.csproj -Raw
          $sourceVersion = $project.SelectSingleNode("//Version").InnerText
          if ($sourceVersion -ne $env:RELEASE_VERSION) { throw "Release version does not match FileMCP.App.csproj." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw "WINDOWS_CODESIGN_PFX_BASE64 is not configured." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "filemcp-release.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          } catch {
            throw "WINDOWS_CODESIGN_PFX_BASE64 is not valid base64."
          }
          "FILEMCP_WINDOWS_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned Windows ARM64 release
        shell: pwsh
        run: ./build_windows_app.ps1 -Architecture arm64 -StagingName $env:FILEMCP_WINDOWS_STAGING_NAME

      - name: Authenticode sign and verify Windows ARM64 release
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: ./release/sign_windows_release.ps1 -Architecture arm64 -PfxPath $env:FILEMCP_WINDOWS_PFX_PATH -StagingName $env:FILEMCP_WINDOWS_STAGING_NAME -Version $env:RELEASE_VERSION

      - name: Post-sign Windows ARM64 packaged smoke
        shell: pwsh
        run: ./tests/test_windows_app.ps1 -Architecture arm64

      - name: Upload signed Windows ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-windows-arm64-signed
          path: dist/FileMCP-v${{ inputs.version }}-windows-arm64.zip
          if-no-files-found: error

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:FILEMCP_WINDOWS_PFX_PATH)) {
            Remove-Item -LiteralPath $env:FILEMCP_WINDOWS_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

  release-macos-arm64:
    name: release-macos-arm64
    needs: release-preflight
    runs-on: macos-26
    timeout-minutes: 35
    environment: production-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release version and prepare signing material
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -Eeuo pipefail
          source_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)"
          test "$source_version" = "$RELEASE_VERSION" || {
            echo "Release version does not match macos/Info.plist." >&2
            exit 1
          }
          test -n "$MACOS_DEVELOPER_ID_P12_BASE64" || { echo "MACOS_DEVELOPER_ID_P12_BASE64 is not configured." >&2; exit 1; }
          test -n "$APPLE_NOTARY_KEY_P8_BASE64" || { echo "APPLE_NOTARY_KEY_P8_BASE64 is not configured." >&2; exit 1; }

          p12_path="$RUNNER_TEMP/filemcp-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/filemcp-notary-key.p8"
          python3 - "$p12_path" "$notary_key_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["MACOS_DEVELOPER_ID_P12_BASE64"], validate=True))
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(os.environ["APPLE_NOTARY_KEY_P8_BASE64"], validate=True))
          PY
          chmod 600 "$p12_path" "$notary_key_path"
          echo "FILEMCP_MACOS_P12_PATH=$p12_path" >> "$GITHUB_ENV"
          echo "FILEMCP_APPLE_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"

      - name: Build unsigned macOS app
        shell: bash
        run: ./build_macos_app.sh

      - name: Developer ID sign, notarize, staple and verify
        shell: bash
        env:
          FILEMCP_MACOS_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          FILEMCP_APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          FILEMCP_APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./release/sign_notarize_macos.sh

      - name: Verify signed bundle legal resources
        shell: bash
        run: |
          set -Eeuo pipefail
          cmp LICENSE dist/FileMCP.app/Contents/Resources/FileMCP-LICENSE.txt
          cmp vendor/tunnel-client/LICENSE dist/FileMCP.app/Contents/Resources/tunnel-client-LICENSE.txt
          cmp vendor/tunnel-client/NOTICE dist/FileMCP.app/Contents/Resources/tunnel-client-NOTICE.txt
          cmp vendor/tunnel-client/darwin-arm64/THIRD-PARTY-LICENSES.txt dist/FileMCP.app/Contents/Resources/tunnel-client-THIRD-PARTY-LICENSES.txt

      - name: Upload signed and notarized macOS package
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-macos-arm64-signed-notarized
          path: dist/FileMCP-v${{ inputs.version }}-macos-arm64.zip
          if-no-files-found: error

      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/filemcp-developer-id.p12" "$RUNNER_TEMP/filemcp-notary-key.p8"
